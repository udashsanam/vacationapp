name: Deploy to Google Play

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests (Android)
        run: ./gradlew clean testDebugUnitTest

  distribute:
    name: Build & Upload to Google Play
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Version Bump
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: app/build.gradle.kts
          versionCode: ${{ github.run_number }}

      # -----------------------
      # Decode signing keystore
      # -----------------------
      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release-key.jks

      # -----------------------
      # Create keystore.properties
      # -----------------------
      - name: Create keystore.properties
        run: |
          echo "storeFile=release-key.jks" >> keystore.properties
          echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties

      - name: Build Signed APK
        run: ./gradlew assembleRelease

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4 # Use the latest version
        with:
            name: release-apk-
            # FIX: Use a wildcard (*) to reliably find the generated APK file
            path: app/build/outputs/apk/release/*.apk
